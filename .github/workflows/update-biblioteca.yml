name: Sincronizar biblioteca.json

on:
  repository_dispatch:
    types: [sincronizar_libros]

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Escribir el nuevo JSON
        env:
          ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          NUEVOS_LIBROS: ${{ github.event.client_payload.libros }}
        run: |
          # Guardar los datos que envía la página web en el archivo
          echo "$NUEVOS_LIBROS" > biblioteca.json

          # Configurar Git
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add biblioteca.json
          
          # Hacer commit solo si hay cambios
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática de biblioteca [skip ci]"
          
          # Subir usando el token secreto
          git push https://${ACCESS_TOKEN}@github.com/${{ github.repository }}.git main
